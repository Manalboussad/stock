<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stock List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-5">My Stock List</h1>

        <div class="row g-4 mb-5">
            <div class="col">
                <input type="text" id="productName" class="form-control" placeholder="Product Name">
            </div>
            <div class="col">
                <input type="number" id="quantity" class="form-control" placeholder="Quantity" min="0" step="1">
            </div>
            <div class="col">
                <input type="number" id="price" class="form-control" placeholder="Price per unit" min="0" step="0.01">
            </div>
            <div class="col-auto">
                <button id="addBtn" class="btn btn-primary">Add Product</button>
            </div>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="stockList"></tbody>
        </table>
    </div>

    <script defer src="js3.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
